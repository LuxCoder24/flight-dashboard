<script>
(function () {
  'use strict';

  /* ================= CONFIG (edit here, or override with URL params) ================= */
  var CONFIG = {
    // PLACEHOLDER location. Replace with the coordinates of your window.
    HOME_LAT: 38.8512, HOME_LON: -77.0402, HOME_SET: false,
    WINDOW_HEADING: 190,   // compass direction the window faces, degrees
    FOV_DEG: 140,          // how wide a slice of sky the window shows, degrees
    MAX_DIST_NM: 6,        // ignore aircraft farther than this (nautical miles)
    MAX_ALT_FT: 12000,     // ignore aircraft higher than this (feet)
    EL_MAX_DEG: 25,        // elevation angle that maps to the top of the sky area
    RADIUS_NM: 10,         // how far the API is asked to search
    POLL_MS: 5000,         // normal poll interval; errors trigger a shared cooldown
    UNITS: 'metric',       // 'metric' (m, km/h, m/s) or 'aviation' (ft, kt, fpm)
    API_BASES: ['https://api.adsb.lol/v2/point', 'https://api.adsb.one/v2/point'],
    ROUTE_API: 'https://api.adsbdb.com/v0/callsign/',
    VIEW: 'auto', DEMO: false, DEBUG: false
  };

  /* ================= pure helpers (unit-tested) ================= */
  var M_PER_DEG = 111320;
  function toRad(d) { return d * Math.PI / 180; }
  function toDeg(r) { return r * 180 / Math.PI; }
  function norm360(a) { a = a % 360; return a < 0 ? a + 360 : a; }
  function norm180(a) { a = norm360(a); return a > 180 ? a - 360 : a; }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function firstNum() { for (var i = 0; i < arguments.length; i++) { if (isNum(arguments[i])) { return arguments[i]; } } return 0; }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  // Turn one raw API record into a clean aircraft, or null if unusable / on the ground.
  function normalize(raw, now) {
    if (!raw || raw.alt_baro === 'ground' || !isNum(raw.lat) || !isNum(raw.lon)) { return null; }
    var alt = isNum(raw.alt_baro) ? raw.alt_baro : (isNum(raw.alt_geom) ? raw.alt_geom : null);
    if (alt === null) { return null; }   // "ground" or no altitude
    var seen = isNum(raw.seen_pos) ? raw.seen_pos : 0;
    return {
      hex: raw.hex || '', callsign: (raw.flight || '').replace(/\s+$/, ''), reg: raw.r || '', type: raw.t || '',
      alt: alt, gs: firstNum(raw.gs), track: firstNum(raw.track),
      vr: firstNum(raw.baro_rate, raw.geom_rate), lat: raw.lat, lon: raw.lon, _t: now - seen * 1000,
      _k: isNum(raw._k) ? raw._k : 1   // simulator time scale; always 1 for real data
    };
  }

  // Where is this aircraft now (dead-reckoned from its last fix) as seen from home?
  function evaluate(ac, now, cfg) {
    var secs = clamp((now - ac._t) / 1000, 0, 60) * (ac._k || 1);
    var v = ac.gs * 0.514444, tr = toRad(ac.track);
    var lat = ac.lat + Math.cos(tr) * v * secs / M_PER_DEG;
    var lon = ac.lon + Math.sin(tr) * v * secs / (M_PER_DEG * Math.cos(toRad(ac.lat)));
    var altFt = ac.alt + ac.vr * secs / 60;
    var e = (lon - cfg.HOME_LON) * M_PER_DEG * Math.cos(toRad(cfg.HOME_LAT));
    var n = (lat - cfg.HOME_LAT) * M_PER_DEG;
    var distM = Math.sqrt(e * e + n * n);
    var az = norm360(toDeg(Math.atan2(e, n)));
    if (cfg.ZONE) {
      var dlat = toRad(lat - cfg.HOME_LAT), dlon = toRad(lon - cfg.HOME_LON);
      var hav = Math.sin(dlat / 2) * Math.sin(dlat / 2) + Math.cos(toRad(cfg.HOME_LAT)) * Math.cos(toRad(lat)) * Math.sin(dlon / 2) * Math.sin(dlon / 2);
      hav = clamp(hav, 0, 1); distM = 2 * 6371000 * Math.atan2(Math.sqrt(hav), Math.sqrt(1 - hav));
      az = norm360(toDeg(Math.atan2(Math.sin(dlon) * Math.cos(toRad(lat)), Math.cos(toRad(cfg.HOME_LAT)) * Math.sin(toRad(lat)) - Math.sin(toRad(cfg.HOME_LAT)) * Math.cos(toRad(lat)) * Math.cos(dlon))));
    }
    var el = toDeg(Math.atan2(altFt * 0.3048, distM));
    var rel = norm180(az - cfg.WINDOW_HEADING);
    return { lat: lat, lon: lon, altFt: altFt, distNm: distM / 1852, az: az, el: el, rel: rel,
             inFov: Math.abs(rel) <= cfg.FOV_DEG / 2 };
  }

  function isCandidate(ev, cfg) {
    return ev.inFov && ev.distNm <= cfg.MAX_DIST_NM && ev.altFt <= cfg.MAX_ALT_FT && ev.altFt > 0;
  }

  // Stick with the current aircraft while it stays valid, otherwise take the nearest one.
  function pick(list, now, cfg, currentHex) {

    var ev = evaluate(f.ac, now, CONFIG), hex = f.ac.hex;
    var x = (0.5 + ev.rel / CONFIG.FOV_DEG) * skyW;
    var y = clamp((0.90 - ev.el / CONFIG.EL_MAX_DEG * 0.80), 0.08, 0.90) * skyH;
    var direction = spriteDir(f.ac.track, CONFIG.WINDOW_HEADING, spriteDirs[hex] || 1);
    spriteDirs[hex] = direction;
    sprite.className = 'aircraftSprite visible' + (isHelicopter(f.ac.type) ? ' helicopter' : '');
    var tf = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) rotate(' +
      (pitchDeg(f.ac.vr, f.ac.gs) * -direction).toFixed(1) + 'deg) scaleX(' + direction + ')';
    sprite.style.webkitTransform = tf; sprite.style.transform = tf;
    var label = sprite.querySelector('.skyLabel');
    label.textContent = showingMulti ? (f.ac.callsign || f.ac.reg || hex) : '';
    label.style.transform = 'scaleX(' + direction + ')';
    label.style.webkitTransform = label.style.transform;
    return { x: x, y: y };
  }

  function renderIdle(now) {
    var ago = lastOk ? Math.round((now - lastOk) / 1000) : -1;
    var sub = nearbyCount + ' airborne nearby; none match this window. Limits: ' +
      (CONFIG.UNITS === 'aviation' ? CONFIG.MAX_DIST_NM + ' nm, ' + CONFIG.MAX_ALT_FT + ' ft' :
       Math.round(CONFIG.MAX_DIST_NM * 1.852 * 10) / 10 + ' km, ' + Math.round(CONFIG.MAX_ALT_FT * 0.3048) + ' m') +
      ', heading ' + CONFIG.WINDOW_HEADING + '°, field of view ' + CONFIG.FOV_DEG + '°';
    if (CONFIG.ZONE) { sub = nearbyCount + ' airborne nearby; none inside your saved viewing zone'; }
    if (lastErr) { sub = 'Live feed unavailable. Retrying in ' + Math.max(0,Math.ceil((readCooldown()-now)/1000)) + ' s…'; }
    $('idleSub').textContent = (lastSeenLabel ? 'Last seen: ' + lastSeenLabel + '  |  ' : '') + sub;
  }

  function updateStatus(now) {
    $('feedInfo').textContent = CONFIG.DEMO ? 'Demo aircraft' : (lastErr ? lastErr + (relayDetails ? ' | ' + relayDetails : '') : (lastOk ? 'Live feed connected' : 'Connecting to live feed…'));
    if (lastErr && retryUntil > now) { $('feedInfo').textContent += ' | Next retry in ' + Math.ceil((retryUntil-now)/1000) + ' s'; }
    var st = $('status');
    st.className = lastErr && (!lastOk || now - lastOk > 20000) ? 'err' : (lastOk && now - lastOk < 20000 ? 'ok' : 'stale');
  }

  function drawTrail() {
    var i, n = trailPts.length;
    for (i = 0; i < dots.length; i++) {
      if (i < n) {
        var p = trailPts[n - 1 - i];
        dots[i].style.left = p.x + 'px'; dots[i].style.top = p.y + 'px';
        dots[i].style.opacity = String(0.55 * (1 - i / dots.length));
      } else { dots[i].style.opacity = '0'; }
    }
  }

  function frame() {
    var now = Date.now();
    if (now - lastPick > 500) {
      lastPick = now;
      var many = pickMany(aircraft, now, CONFIG);
      var wasMulti = showingMulti;
      showingMulti = multiView(CONFIG.VIEW, many.length);
      if (wasMulti !== showingMulti) { trailPts = []; drawTrail(); }
      var f = showingMulti ? (many[0] || null) : pick(aircraft, now, CONFIG, featured ? featured.ac.hex : null);
      var previousSelected = selected;
      selected = showingMulti ? many : (f ? [f] : []);
      for (var si = 0; si < selected.length; si++) {
        var alreadySelected = false;
        for (var sj = 0; sj < previousSelected.length; sj++) {
          if (previousSelected[sj].ac.hex === selected[si].ac.hex) { alreadySelected = true; }
        }
        if (!alreadySelected) { ensureRoute(selected[si].ac.callsign); }
      }
      if (f && (!featured || featured.ac.hex !== f.ac.hex)) { trailPts = []; }
      if (featured && !f) { lastSeenLabel = $('callsign').textContent; }
      featured = f; setTheme();
      panel.className = featured ? (showingMulti ? 'multi' : '') : 'idle';
      if (!featured) { renderIdle(now); }
      updateStatus(now);
    }
    for (var vi = 0; vi < sprites.length; vi++) {
      if (vi < selected.length) {
        var point = drawAircraft(selected[vi], sprites[vi], now);
        if (vi === 0 && !showingMulti && now - lastTrail > 400) {
          lastTrail = now; trailPts.push(point); if (trailPts.length > 16) { trailPts.shift(); } drawTrail();
        }
      } else { sprites[vi].className = 'aircraftSprite'; }
    }
    if (featured && now - lastText > 500) {
      lastText = now;
      if (showingMulti) { renderMulti(now); } else { renderText(featured, evaluate(featured.ac, now, CONFIG)); }
    }
    window.requestAnimationFrame(frame);
  }

  function tickClock() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('clock').textContent = h + ':' + (m < 10 ? '0' : '') + m;
  }

  if (!CONFIG.HOME_SET && !CONFIG.DEMO) {
    var b = $('banner'); b.style.display = 'block';
    b.textContent = 'Location not set yet. Add ?lat=...&lon=... to the page address (or edit CONFIG in index.html).';
  }
  document.documentElement.addEventListener('click', function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !(document.fullscreenElement || document.webkitFullscreenElement)) { try { req.call(el); } catch (e) { /* ignore */ } }
  });

  measure(); tickClock(); setInterval(tickClock, 1000); setTheme(); setInterval(setTheme, 60000);
  if (CONFIG.DEMO) { buildDemoBar(); spawnSim(DEMO_PRESETS[0]); }
  poll(); setInterval(poll, CONFIG.DEMO ? 1000 : CONFIG.POLL_MS);
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
